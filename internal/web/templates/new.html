{{define "content"}}<div class="narrow"><section class="card"><div class="eyebrow">New review artifact</div><h2>Choose committed source refs</h2><p class="muted">Patchflow resolves both refs to exact SHAs and reviews the target from their merge base.</p><form action="{{.BasePath}}/reviews" method="post" class="stack"><div class="grid-two"><label>Base ref<input name="base_ref" value="{{.BaseRef}}" required autocomplete="off"></label><label>Target ref<input name="target_ref" value="{{.TargetRef}}" required autocomplete="off"></label></div><div class="button-row"><button class="button">Create review</button><a href="{{.BasePath}}" class="button button--quiet">Cancel</a></div></form></section></div>{{end}}
