{{define "layout"}}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="application-name" content="Patchflow">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/assets/styles/application.css" data-turbo-track="reload">
    <script type="importmap">{"imports":{"@hotwired/stimulus":"/assets/vendor/stimulus.js","dompurify":"/assets/vendor/dompurify.js","marked":"/assets/vendor/marked.js"}}</script>
    <script src="/assets/vendor/mermaid.js" defer data-turbo-track="reload"></script>
    <script src="/assets/vendor/diff2html.min.js" defer data-turbo-track="reload"></script>
    <script type="module" src="/assets/application.js" data-turbo-track="reload"></script>
  </head>
  <body>
    <header class="site-header">
      <a href="/" class="brand"><span class="brand-mark">P</span><span>Patchflow</span></a>
      {{if .RepositoryName}}
        <nav class="site-context" aria-label="Repository navigation">
          {{if .GitHub}}<a href="{{.GitHub.URL}}" class="github-link" target="_blank" rel="noopener noreferrer" aria-label="{{.GitHub.Label}}" title="{{.GitHub.Label}}"><svg viewBox="0 0 16 16" role="img" aria-hidden="true"><path d="M8 0C3.58 0 0 3.64 0 8.13c0 3.59 2.29 6.64 5.47 7.71.4.08.55-.18.55-.39 0-.19-.01-.83-.01-1.5-2.01.38-2.53-.5-2.69-.96-.09-.23-.48-.96-.82-1.15-.28-.15-.68-.53-.01-.54.63-.01 1.08.59 1.23.83.72 1.23 1.87.88 2.33.67.07-.53.28-.88.51-1.08-1.78-.21-3.64-.91-3.64-4.02 0-.89.31-1.62.82-2.19-.08-.2-.36-1.04.08-2.16 0 0 .67-.22 2.2.84A7.5 7.5 0 0 1 8 3.98c.68 0 1.36.09 2 .28 1.53-1.06 2.2-.84 2.2-.84.44 1.12.16 1.96.08 2.16.51.57.82 1.3.82 2.19 0 3.12-1.87 3.81-3.65 4.02.29.25.54.74.54 1.5 0 1.08-.01 1.95-.01 2.22 0 .22.15.47.55.39A8.01 8.01 0 0 0 16 8.13C16 3.64 12.42 0 8 0Z"/></svg></a>{{end}}
          <a href="/" class="repository-overview-link">All repositories</a>
          <a href="{{.BasePath}}" class="repository-chip">{{.RepositoryName}}</a>
        </nav>
      {{end}}
    </header>
    <main class="page-shell">
      {{if .Notice}}<div class="flash">{{.Notice}}</div>{{end}}
      {{if .Alert}}<div class="flash flash--alert">{{.Alert}}</div>{{end}}
      {{template "content" .}}
    </main>
  </body>
</html>{{end}}
