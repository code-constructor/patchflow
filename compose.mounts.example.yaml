services:
  app:
    volumes:
      # Add as many host roots as needed. Keep every container target below
      # /workspace so it appears in Patchflow's bounded repository picker.
      - /absolute/path/to/client-projects:/workspace/client-projects
      - /absolute/path/to/other-worktrees:/workspace/other-worktrees
      # Linked worktrees refer to their original absolute host paths. Mirror
      # every additional worktree root (and its main repository root) there too.
      - /absolute/path/to/client-projects:/absolute/path/to/client-projects
      - /absolute/path/to/other-worktrees:/absolute/path/to/other-worktrees
