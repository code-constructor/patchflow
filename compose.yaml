name: ${COMPOSE_PROJECT_NAME:-patchflow}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        USER_ID: ${PATCHFLOW_UID:-1000}
        GROUP_ID: ${PATCHFLOW_GID:-1000}
    image: patchflow:dev
    init: true
    restart: unless-stopped
    environment:
      PATCHFLOW_CONFIG_PATH: ${PATCHFLOW_DOCKER_CONFIG_PATH:-/workspace/.patchflow/config.json}
      PATCHFLOW_TTS_URL: http://speech:5000
    command: ["patchflow", "serve", "--config", "${PATCHFLOW_DOCKER_CONFIG_PATH:-/workspace/.patchflow/config.json}", "--addr", "0.0.0.0:3000"]
    volumes:
      - ${HOME}/Projects:/workspace
      - ${PATCHFLOW_WORKTREES_PATH:-${HOME}/.herdr/worktrees}:/workspace/worktrees
      # Linked worktree metadata contains absolute host paths. Mirror both roots
      # at their original locations so Git can follow those internal pointers.
      - ${HOME}/Projects:${HOME}/Projects
      - ${PATCHFLOW_WORKTREES_PATH:-${HOME}/.herdr/worktrees}:${PATCHFLOW_WORKTREES_PATH:-${HOME}/.herdr/worktrees}
      - ${PATCHFLOW_GIT_CONFIG_PATH:-${HOME}/.config/git/config}:/home/patchflow/.config/git/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/up > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      speech:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-patchflow}.rule=Host(`${DEV_DOMAIN:-patchflow.localhost}`)"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-patchflow}.loadbalancer.server.port=3000"
    networks:
      - default
      - dev-proxy

  speech:
    build:
      context: .
      dockerfile: Dockerfile.speech
      args:
        CHATTERBOX_REVISION: ${PATCHFLOW_CHATTERBOX_REVISION:-ce5a900dbdbc776eeb3d00c1c1607143c7604a5b}
    image: patchflow-speech:dev
    restart: unless-stopped
    environment:
      PATCHFLOW_TTS_DEVICE: cpu
      PATCHFLOW_TTS_THREADS: ${PATCHFLOW_TTS_THREADS:-16}
      PATCHFLOW_TTS_CHUNK_TOKENS: ${PATCHFLOW_TTS_CHUNK_TOKENS:-24}
    volumes:
      - speech-models:/models
    depends_on:
      voice-design:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/info', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  voice-design:
    build:
      context: .
      dockerfile: Dockerfile.voice-design
      args:
        QWEN_TTS_VERSION: ${PATCHFLOW_QWEN_TTS_VERSION:-0.1.1}
    image: patchflow-voice-design:dev
    restart: "no"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    ipc: host
    shm_size: 8gb
    environment:
      PATCHFLOW_TTS_VOICE_INSTRUCTION: ${PATCHFLOW_TTS_VOICE_INSTRUCTION:-Create an original mature American female artificial-intelligence voice for a futuristic technical interface. Calm, highly intelligent, precise, subtly warm, confident, and composed. Use clear diction, a measured conversational pace, a low-to-mid pitch, restrained emotion, faint synthetic polish, and a trace of dry wit. The voice must be distinct and must not imitate or resemble any real person or existing fictional character.}
    volumes:
      - speech-models:/models

volumes:
  speech-models:
    name: ${PATCHFLOW_SPEECH_MODELS_VOLUME:-patchflow-speech-models}

networks:
  dev-proxy:
    external: true
