name: ${COMPOSE_PROJECT_NAME:-patchflow}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        USER_ID: ${PATCHFLOW_UID:-1000}
        GROUP_ID: ${PATCHFLOW_GID:-1000}
    image: patchflow:dev
    init: true
    restart: unless-stopped
    environment:
      PATCHFLOW_CONFIG_PATH: ${PATCHFLOW_DOCKER_CONFIG_PATH:-/workspace/.patchflow/config.json}
      PATCHFLOW_TTS_URL: http://speech:5000
      PATCHFLOW_TTS_VOICE: ${PATCHFLOW_TTS_VOICE:-en_US-lessac-high}
    command: ["patchflow", "serve", "--config", "${PATCHFLOW_DOCKER_CONFIG_PATH:-/workspace/.patchflow/config.json}", "--addr", "0.0.0.0:3000"]
    volumes:
      - ${HOME}/Projects:/workspace
      - ${PATCHFLOW_WORKTREES_PATH:-${HOME}/.herdr/worktrees}:/workspace/worktrees
      # Linked worktree metadata contains absolute host paths. Mirror both roots
      # at their original locations so Git can follow those internal pointers.
      - ${HOME}/Projects:${HOME}/Projects
      - ${PATCHFLOW_WORKTREES_PATH:-${HOME}/.herdr/worktrees}:${PATCHFLOW_WORKTREES_PATH:-${HOME}/.herdr/worktrees}
      - ${PATCHFLOW_GIT_CONFIG_PATH:-${HOME}/.config/git/config}:/home/patchflow/.config/git/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/up > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      speech:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-patchflow}.rule=Host(`${DEV_DOMAIN:-patchflow.localhost}`)"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-patchflow}.loadbalancer.server.port=3000"
    networks:
      - default
      - dev-proxy

  speech:
    build:
      context: .
      dockerfile: Dockerfile.speech
      args:
        PIPER_VERSION: ${PATCHFLOW_PIPER_VERSION:-1.6.0}
        PIPER_VOICE: ${PATCHFLOW_TTS_VOICE:-en_US-lessac-high}
    image: patchflow-speech:dev
    restart: unless-stopped
    command: ["-m", "${PATCHFLOW_TTS_VOICE:-en_US-lessac-high}"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/info', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

networks:
  dev-proxy:
    external: true
