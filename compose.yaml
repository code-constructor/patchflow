name: ${COMPOSE_PROJECT_NAME:-patchflow}

# Every machine-specific value has an environment default. Copy .env.example to
# .env to change them, and use compose.override.yaml (Git-ignored, see
# compose.override.example.yaml) for extra mounts, a reverse proxy, or GPUs.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        USER_ID: ${PATCHFLOW_UID:-1000}
        GROUP_ID: ${PATCHFLOW_GID:-1000}
    image: patchflow:dev
    init: true
    restart: unless-stopped
    environment:
      PATCHFLOW_CONFIG_PATH: ${PATCHFLOW_DOCKER_CONFIG_PATH:-/workspace/.patchflow/config.json}
      PATCHFLOW_BROWSE_ROOT: /workspace
      PATCHFLOW_TTS_URL: ${PATCHFLOW_TTS_URL:-}
    command: ["patchflow", "serve", "--config", "${PATCHFLOW_DOCKER_CONFIG_PATH:-/workspace/.patchflow/config.json}", "--addr", "0.0.0.0:3000"]
    ports:
      - "${PATCHFLOW_BIND:-127.0.0.1}:${PATCHFLOW_PORT:-3000}:3000"
    volumes:
      - ${PATCHFLOW_PROJECTS_PATH:-${HOME}/Projects}:/workspace
      # Linked worktree metadata contains absolute host paths. Mirror the root
      # at its original location so Git can follow those internal pointers.
      - ${PATCHFLOW_PROJECTS_PATH:-${HOME}/Projects}:${PATCHFLOW_PROJECTS_PATH:-${HOME}/Projects}
      - ${PATCHFLOW_GIT_CONFIG_PATH:-${HOME}/.config/git/config}:/home/patchflow/.config/git/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/up > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Optional local speech stack. Enable it with COMPOSE_PROFILES=speech and
  # PATCHFLOW_TTS_URL=http://speech:5000 in .env.
  speech:
    profiles: ["speech"]
    build:
      context: .
      dockerfile: Dockerfile.speech
      args:
        TORCH_IMAGE: ${PATCHFLOW_TORCH_IMAGE:-pytorch/pytorch:2.9.1-cuda12.8-cudnn9-runtime}
        CHATTERBOX_REVISION: ${PATCHFLOW_CHATTERBOX_REVISION:-ce5a900dbdbc776eeb3d00c1c1607143c7604a5b}
    image: patchflow-speech:dev
    restart: unless-stopped
    environment:
      PATCHFLOW_TTS_DEVICE: ${PATCHFLOW_TTS_DEVICE:-cpu}
      PATCHFLOW_TTS_THREADS: ${PATCHFLOW_TTS_THREADS:-16}
      PATCHFLOW_TTS_CHUNK_TOKENS: ${PATCHFLOW_TTS_CHUNK_TOKENS:-24}
    volumes:
      - speech-models:/models
    depends_on:
      voice-design:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/info', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  voice-design:
    profiles: ["speech"]
    build:
      context: .
      dockerfile: Dockerfile.voice-design
      args:
        TORCH_IMAGE: ${PATCHFLOW_TORCH_IMAGE:-pytorch/pytorch:2.9.1-cuda12.8-cudnn9-runtime}
        QWEN_TTS_VERSION: ${PATCHFLOW_QWEN_TTS_VERSION:-0.1.1}
    image: patchflow-voice-design:dev
    restart: "no"
    environment:
      # Designing the reference voice on a CPU works but takes a long time.
      # See compose.override.example.yaml for attaching an NVIDIA or AMD GPU.
      PATCHFLOW_TTS_DEVICE: ${PATCHFLOW_VOICE_DESIGN_DEVICE:-cpu}
      PATCHFLOW_TTS_DTYPE: ${PATCHFLOW_VOICE_DESIGN_DTYPE:-float32}
      PATCHFLOW_TTS_VOICE_INSTRUCTION: ${PATCHFLOW_TTS_VOICE_INSTRUCTION:-Create an original mature American female artificial-intelligence voice for a futuristic technical interface. Calm, highly intelligent, precise, subtly warm, confident, and composed. Use clear diction, a measured conversational pace, a low-to-mid pitch, restrained emotion, faint synthetic polish, and a trace of dry wit. The voice must be distinct and must not imitate or resemble any real person or existing fictional character.}
    volumes:
      - speech-models:/models

volumes:
  speech-models:
    name: ${PATCHFLOW_SPEECH_MODELS_VOLUME:-patchflow-speech-models}
